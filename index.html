<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2447">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Recuperação de Poço - P-SHI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#0b2447;color:#fff;margin:0;padding:15px}
.container{max-width:1200px;margin:auto}
.card{background:#19376d;padding:15px;border-radius:10px;margin-bottom:15px}
h1,h2,h3{text-align:center;margin:5px}
label{font-weight:bold}
input{width:100%;padding:8px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;background:#fff;color:#000}
th{background:#1e3a8a;color:#fff}
td,th{border:1px solid #ccc;padding:4px;text-align:center}
button{background:#00b894;color:#fff;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;margin-right:5px}
#criterio90{font-size:18px;font-weight:bold;margin-top:10px}
canvas{background:#fff;border-radius:8px}
.printOnly{
 display:none;
 font-weight:bold;
 margin-bottom:10px;
}

@media print{
 button,input{
   display:none;
 }

 .printOnly{
   display:block;
 }

 body{
   background:#fff;
   color:#000;
 }

 .card{
   background:#fff;
   color:#000;
 }
}
</style>
</head>
<body>
<div class="container">
<h1>SANEAGO</h1>
<h3>Supervisão de Hidrogeologia - P-SHI</h3>
<h2>Recuperação de Poço</h2>

<div class="card">
<label>Nome do Poço</label>
<input id="nomePoco" type="text">
<div id="printNome" class="printOnly"></div>

<label>NE (m)</label>
<input id="ne" type="number" step="0.01">
<div id="printNE" class="printOnly"></div>

<label>ND Final do Bombeamento (m)</label>
<input id="ndFinal" type="number" step="0.01">
<div id="printND" class="printOnly"></div>
<br><br>
<button onclick="window.print()">📄 Gerar PDF</button>
<button onclick="limpar()">🗑 Limpar</button>
</div>

<div class="card">
<div id="rebaixamento">SP: -</div>
<div id="recmax">Recuperação Máxima: -</div>
<div id="tempo90">Tempo para 90%: -</div>
<div id="criterio90"></div>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<table>
<thead><tr><th>Tempo (min)</th><th>ND (m)</th><th>SP'</th><th>%</th></tr></thead>
<tbody id="tabela"></tbody>
</table>
</div>
</div>

<script>
const tempos=[1,4,7,10,15,20,25,30,35,40,45,50,55,60,70,80,90,100,110,120,150,180,210,240,270,300,330,360,390,420,450,480,510,540,570,600,660,720,780,840,900,960,1020,1080,1140,1200,1260,1320,1380,1440];
const tabela=document.getElementById('tabela');

tempos.forEach((t,i)=>{
 tabela.innerHTML+=`<tr><td>${t}</td><td><input type="number" step="0.01" id="nd_${i}"></td><td id="sp_${i}"></td><td id="pc_${i}"></td></tr>`;
});

const chart=new Chart(document.getElementById('grafico'),{
 type:'line',
 data:{labels:[],datasets:[
  {label:'Recuperação (%)',data:[]},
  {label:'Limite 90%',data:[]}
 ]},
 options:{responsive:true,scales:{y:{min:0,max:100}}}
});

function save(){
 const d={};
 document.querySelectorAll('input').forEach(i=>d[i.id]=i.value);
 localStorage.setItem('pshi_rec',JSON.stringify(d));
}

function load(){
 let d=localStorage.getItem('pshi_rec');
 if(!d)return;
 d=JSON.parse(d);
 Object.keys(d).forEach(k=>{
  const e=document.getElementById(k);
  if(e)e.value=d[k];
 });
 atualizar();
}

function atualizar(){
 save();
 const ne=parseFloat(document.getElementById('ne').value);
 const ndf=parseFloat(document.getElementById('ndFinal').value);
 document.getElementById("printNome").innerHTML =
"Nome do Poço: " + document.getElementById("nomePoco").value;

document.getElementById("printNE").innerHTML =
"NE: " + document.getElementById("ne").value + " m";

document.getElementById("printND").innerHTML =
"ND Final do Bombeamento: " + document.getElementById("ndFinal").value + " m";
 if(isNaN(ne)||isNaN(ndf)) return;

 const sp=ndf-ne;
 document.getElementById('rebaixamento').innerHTML='SP: '+sp.toFixed(2)+' m';

 let max=0;
 let t90='Não atingido';
 let xs=[], ys=[];

 tempos.forEach((t,i)=>{
  const nd=parseFloat(document.getElementById('nd_'+i).value);
  if(!isNaN(nd)){
    const spr=ndf-nd;
    const p=(spr/sp)*100;
    document.getElementById('sp_'+i).innerHTML=spr.toFixed(2);
    document.getElementById('pc_'+i).innerHTML=p.toFixed(2)+'%';
    xs.push(t);
    ys.push(p.toFixed(2));
    if(p>max) max=p;
    if(p>=90 && t90==='Não atingido') t90=t+' min';
  }
 });

 document.getElementById('recmax').innerHTML='Recuperação Máxima: '+max.toFixed(2)+'%';
 document.getElementById('tempo90').innerHTML='Tempo para 90%: '+t90;

 if(max>=90){
  criterio90.innerHTML='😊 ATENDE AO CRITÉRIO DE 90% DA SEMAD';
  criterio90.style.color='#00ff88';
 }else{
  criterio90.innerHTML='☹️ NÃO ATENDE AO CRITÉRIO DE 90% DA SEMAD';
  criterio90.style.color='#ff6b6b';
 }

 chart.data.labels=xs;
 chart.data.datasets[0].data=ys;
 chart.data.datasets[1].data=xs.map(()=>90);
 chart.update();
}

function limpar(){
 localStorage.removeItem('pshi_rec');
 location.reload();
}
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',atualizar));
load();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        console.log("PWA instalado:", reg.scope);
      })
      .catch(err => {
        console.log("Erro ao registrar SW:", err);
      });
  });
}
</script>

</body>
</html>
